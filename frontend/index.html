<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>ORYN</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-theme="dark">

  <div class="app" id="app">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="img/logo.png" alt="ORYN" width="36" height="36"></div>
        <div class="brand-text">
          <span class="brand-name" data-i18n="app.name"></span>
          <span class="brand-badge" data-i18n="common.localBadge"></span>
        </div>
      </div>

      <button class="btn btn-new" id="newChatBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span data-i18n="top.newChat"></span>
      </button>

      <nav class="nav" id="mainNav">
        <button class="nav-item is-active" data-view="chat" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.6 8.6 0 0 1-3.7-.8L3 21l2-5.4a8.3 8.3 0 0 1-1-4A8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z"/></svg>
          <span data-i18n="nav.chat"></span>
        </button>
        <button class="nav-item" data-view="images" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span data-i18n="nav.images"></span>
        </button>
        <button class="nav-item" data-view="videos" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg>
          <span data-i18n="nav.videos"></span>
        </button>
        <button class="nav-item" data-view="agent" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
          <span data-i18n="nav.agent"></span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span data-i18n="nav.settings"></span>
        </button>
      </nav>

      <div class="convos">
        <div class="convos-title">
          <span data-i18n="chat.newConversation"></span>
        </div>
        <div class="convos-list" id="conversationList"></div>
      </div>

      <div class="sidebar-foot">
        <div class="sys-pill" id="sysPill" title="" data-i18n-title="status.checking">
          <span class="sys-dot" id="sysDot"></span>
          <span class="sys-text" data-i18n="status.checking"></span>
        </div>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main">

      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mob" id="menuToggle" type="button" aria-label="menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <span class="view-label" id="viewLabel" data-i18n="nav.chat"></span>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="themeToggleBtn" type="button" data-i18n-title="settings.theme">
            <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </button>
        </div>
      </header>

      <section class="view is-active" id="view-chat">
        <!-- Welcome / empty state -->
        <div class="welcome" id="welcomeScreen">
          <div class="wl-eyebrow" data-i18n="chat.welcomeEyebrow"></div>
          <h1 class="wl-title"><span data-i18n="chat.welcomeTitle1"></span> <span class="grad" data-i18n="chat.welcomeTitle2"></span></h1>
          <p class="wl-sub" data-i18n="chat.welcomeSub"></p>
          <div class="sugg">
            <button class="chip" type="button" data-i18n="chat.sug1"></button>
            <button class="chip" type="button" data-i18n="chat.sug2"></button>
            <button class="chip" type="button" data-i18n="chat.sug3"></button>
          </div>
        </div>
        <!-- Messages -->
        <div class="messages" id="chatMessages" aria-live="polite"></div>
        <!-- Chat tools: visão / pesquisa / arquivos -->
        <div class="chat-tools" id="chatTools">
          <div class="ct-tabs">
            <button class="ct-tab" data-ttab="vision" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span data-i18n="nav.vision"></span>
            </button>
            <button class="ct-tab" data-ttab="search" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <span data-i18n="nav.search"></span>
            </button>
            <button class="ct-tab" data-ttab="files" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
              <span data-i18n="nav.files"></span>
            </button>
          </div>

          <div class="ct-panel hidden" data-ttp="vision">
            <div class="ct-grid">
              <div class="drop drop-sm" id="visionDrop">
                <div class="drop-title" data-i18n="vision.dropTitle"></div>
                <div class="drop-sub" data-i18n="vision.dropSub"></div>
                <button class="btn btn-sm" id="visionPickBtn" type="button" data-i18n="vision.selectBtn"></button>
                <input type="file" id="visionImgInput" accept="image/*" class="hidden">
              </div>
              <div>
                <div class="vis-preview hidden" id="visionPreviewBox">
                  <img id="visionPreview" alt="">
                  <div class="vis-ask-row">
                    <input type="text" id="visionAskInput" data-i18n-placeholder="vision.askPlaceholder">
                    <button class="btn btn-sm" id="visionAskBtn" type="button" data-i18n="vision.analyze"></button>
                  </div>
                </div>
                <div class="vis-answer hidden" id="visionAnswer"></div>
              </div>
            </div>
            <div class="ct-foot">
              <span class="vis-state" id="visionStatus"></span>
            </div>
          </div>

          <div class="ct-panel hidden" data-ttp="search">
            <div class="search-row">
              <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder">
              <button class="btn btn-sm" id="searchBtn" type="button" data-i18n="search.button"></button>
            </div>
            <div class="search-results" id="searchResults">
              <div class="empty-state">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <div class="empty-title" data-i18n="search.emptyTitle"></div>
                <div class="empty-sub" data-i18n="search.emptySub"></div>
              </div>
            </div>
            <div class="search-extra hidden" id="searchExtra" data-i18n="search.resultsFor"></div>
          </div>

          <div class="ct-panel hidden" data-ttp="files">
            <div class="ct-grid">
              <div class="drop drop-sm" id="filesDrop">
                <div class="drop-title" data-i18n="files.dropTitle"></div>
                <div class="drop-sub" data-i18n="files.dropSub"></div>
                <button class="btn btn-sm" id="filesPickBtn" type="button" data-i18n="files.selectBtn"></button>
                <input type="file" id="filesInput" class="hidden" multiple>
              </div>
              <div>
                <div class="file-list" id="fileList"></div>
                <div class="preview-panel hidden" id="filePreviewPanel">
                  <div class="preview-head">
                    <span data-i18n="files.previewOf"></span>
                    <span class="preview-name" id="filePreviewName"></span>
                  </div>
                  <div class="preview-body" id="filePreviewContent"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Composer -->
        <div class="composer-wrap">
          <div class="composer" id="composer">
            <button class="icon-btn at" id="attachBtn" type="button" data-i18n-title="chat.attach">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button class="icon-btn at" id="searchToggleBtn" type="button" data-i18n-title="chat.webSearch">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            </button>
            <textarea id="promptInput" rows="1" data-i18n-placeholder="chat.placeholder"></textarea>
            <button class="btn-send" id="sendBtn" type="button" aria-label="send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
            <button class="btn-send stop hidden" id="stopBtn" type="button" aria-label="stop">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
          <div class="composer-hint">
            <span data-i18n="chat.contextHint"></span>
          </div>
          <input type="file" id="attachInput" class="hidden" multiple>
          <div class="preview-row hidden" id="attachPreviewRow"></div>
        </div>
        <div class="footer-hint" data-i18n="chat.footerHint"></div>
      </section>

      <!-- ============ IMAGES ============ -->
      <section class="view" id="view-images">
        <div class="gen-head">
          <span class="chip chip-gold" data-i18n="images.chip"></span>
          <h2><span data-i18n="images.title1"></span> <span class="grad" data-i18n="images.title2"></span></h2>
          <p data-i18n="images.sub"></p>
        </div>
        <div class="gen-layout">
          <div class="card form-card">
            <label class="lbl" data-i18n="images.prompt"></label>
            <textarea id="imgPrompt" rows="3" data-i18n-placeholder="images.promptPlaceholder"></textarea>
            <div class="frow">
              <div class="fcell">
                <label class="lbl sm" data-i18n="images.aspectRatio"></label>
                <select id="imgAR">
                  <option value="1:1">1:1</option>
                  <option value="16:9">16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="4:3">4:3</option>
                  <option value="3:4">3:4</option>
                  <option value="21:9">21:9</option>
                </select>
              </div>
              <div class="fcell">
                <label class="lbl sm" data-i18n="images.seed"></label>
                <div class="seed-row">
                  <input type="number" id="imgSeed" value="0" min="0">
                  <button class="icon-btn" id="imgSeedRand" type="button" data-i18n-title="images.random">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
                  </button>
                </div>
              </div>
              <div class="fcell">
                <label class="lbl sm" data-i18n="images.batch"></label>
                <select id="imgBatch">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </div>
            </div>
            <div class="gen-actions">
              <div class="gen-status" id="imgStatus"></div>
              <button class="btn btn-primary" id="imgGenerateBtn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
                <span data-i18n="images.generate"></span>
              </button>
            </div>
          </div>
          <div class="result-card">
            <div class="result-grid" id="imgGrid">
              <div class="empty-state">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                <div class="empty-title" data-i18n="images.emptyTitle"></div>
                <div class="empty-sub" data-i18n="images.emptySub"></div>
              </div>
            </div>
            <div class="result-hint" data-i18n="images.hint"></div>
          </div>
        </div>
      </section>

      <!-- ============ VIDEOS ============ -->
      <section class="view" id="view-videos">
        <div class="gen-head">
          <span class="chip chip-gold" data-i18n="videos.chip"></span>
          <h2><span data-i18n="videos.title1"></span> <span class="grad" data-i18n="videos.title2"></span></h2>
          <p data-i18n="videos.sub"></p>
        </div>
        <div class="seg" id="vidModeSeg">
          <button class="seg-btn is-active" data-vidmode="t2v" type="button" data-i18n="videos.generate"></button>
          <button class="seg-btn" data-vidmode="i2v" type="button" data-i18n="videos.animate"></button>
        </div>
        <div class="gen-layout">
          <div class="card form-card">
            <div class="i2v-box hidden" id="vidImgBox">
              <div class="drop drop-sm" id="vidImgDrop">
                <div class="drop-title" data-i18n="vision.dropTitle"></div>
                <button class="btn btn-sm" id="vidImgPickBtn" type="button" data-i18n="vision.selectBtn"></button>
                <input type="file" id="vidImgInput" accept="image/*" class="hidden">
              </div>
              <img id="vidImgPreview" class="vid-img-preview hidden" alt="">
            </div>
            <label class="lbl" data-i18n="images.prompt"></label>
            <textarea id="vidPrompt" rows="3" data-i18n-placeholder="videos.promptPlaceholder"></textarea>
            <div class="frow">
              <div class="fcell">
                <label class="lbl sm" data-i18n="videos.model"></label>
                <select id="vidModel">
                  <option value="wan_5b">Wan 2.2 5B</option>
                  <option value="wan_14b">Wan 2.2 14B</option>
                </select>
              </div>
              <div class="fcell">
                <label class="lbl sm" data-i18n="videos.duration"></label>
                <select id="vidDuration">
                  <option value="3">3s</option>
                  <option value="5" selected>5s</option>
                  <option value="8">8s</option>
                  <option value="10">10s</option>
                </select>
              </div>
              <div class="fcell">
                <label class="lbl sm" data-i18n="videos.fps"></label>
                <select id="vidFps">
                  <option value="16">16</option>
                  <option value="24" selected>24</option>
                  <option value="30">30</option>
                </select>
              </div>
            </div>
            <div class="frow sound-row">
              <label class="lbl sm" data-i18n="videos.sound"></label>
              <label class="switch">
                <input type="checkbox" id="vidSoundToggle" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="gen-actions">
              <div class="gen-status" id="vidStatus"></div>
              <button class="btn btn-primary" id="vidGenerateBtn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
                <span data-i18n="videos.generate"></span>
              </button>
            </div>
          </div>
          <div class="result-card">
            <div class="result-grid wide" id="vidGrid">
              <div class="empty-state">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg>
                <div class="empty-title" data-i18n="videos.emptyTitle"></div>
                <div class="empty-sub" data-i18n="videos.emptySub"></div>
              </div>
            </div>
            <div class="result-hint" data-i18n="videos.hint"></div>
          </div>
        </div>
      </section>

      <!-- ============ AGENTE ============ -->
      <section class="view" id="view-agent">
        <div class="gen-head">
          <span class="chip chip-gold" data-i18n="agent.chip"></span>
          <h2><span data-i18n="agent.title1"></span> <span class="grad" data-i18n="agent.title2"></span></h2>
          <p data-i18n="agent.sub"></p>
        </div>
        <div class="gen-layout">
          <div class="card form-card">
            <label class="lbl" data-i18n="agent.task"></label>
            <textarea id="agentTask" rows="3" data-i18n-placeholder="agent.placeholder"></textarea>
            <div class="gen-actions">
              <div class="gen-status" id="agentStatus"></div>
              <button class="btn btn-primary" id="agentRunBtn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
                <span data-i18n="agent.run"></span>
              </button>
            </div>
            <div class="result-hint" id="agentWorkspace"></div>
          </div>
          <div class="result-card">
            <div class="gen-result-list" id="agentLog">
              <div class="empty-state">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
                <div class="empty-title" data-i18n="agent.emptyTitle"></div>
                <div class="empty-sub" data-i18n="agent.emptySub"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ SETTINGS ============ -->
      <section class="view" id="view-settings">
        <div class="gen-head">
          <span class="chip chip-gold" data-i18n="settings.backend"></span>
          <h2><span data-i18n="settings.title1"></span> <span class="grad" data-i18n="settings.title2"></span></h2>
          <p data-i18n="settings.sub"></p>
        </div>

        <div class="settings-grid">

          <div class="card set-card">
            <h3 class="set-title" data-i18n="settings.interface"></h3>
            <label class="lbl" data-i18n="settings.language"></label>
            <select id="setLang"></select>
            <label class="lbl" data-i18n="settings.theme"></label>
            <select id="setTheme"></select>
            <label class="lbl" data-i18n="settings.animations"></label>
            <label class="switch">
              <input type="checkbox" id="setAnimations" checked>
              <span class="slider"></span>
            </label>
          </div>

          <div class="card set-card">
            <h3 class="set-title" data-i18n="settings.customize"></h3>
            <div class="cust-row">
              <label class="lbl sm" data-i18n="settings.customPrimary"></label>
              <input type="color" id="custPrimary" value="#7c5cff">
            </div>
            <div class="cust-row">
              <label class="lbl sm" data-i18n="settings.customBg"></label>
              <input type="color" id="custBg" value="#0b0b0f">
            </div>
            <div class="cust-row">
              <label class="lbl sm" data-i18n="settings.customCards"></label>
              <input type="color" id="custCards" value="#17171f">
            </div>
            <div class="cust-row">
              <label class="lbl sm" data-i18n="settings.customText"></label>
              <input type="color" id="custText" value="#eceaf2">
            </div>
            <button class="btn btn-sm" id="resetThemeBtn" type="button" data-i18n="settings.resetTheme"></button>
          </div>

          <div class="card set-card">
            <h3 class="set-title" data-i18n="settings.intelligence"></h3>
            <label class="lbl" data-i18n="settings.model"></label>
            <select id="setModel"></select>
            <div class="frow">
              <div class="fcell">
                <label class="lbl sm" data-i18n="settings.temperature"></label>
                <input type="range" id="setTemp" min="0" max="2" step="0.1" value="0.7">
                <span class="range-val" id="setTempVal">0.7</span>
              </div>
              <div class="fcell">
                <label class="lbl sm" data-i18n="settings.context"></label>
                <select id="setContext">
                  <option value="4096">4k</option>
                  <option value="8192" selected>8k</option>
                  <option value="16384">16k</option>
                </select>
                <span class="range-val" data-i18n="settings.contextTokens"></span>
              </div>
            </div>
            <label class="lbl" data-i18n="settings.memory"></label>
            <label class="switch">
              <input type="checkbox" id="setMemory" checked>
              <span class="slider"></span>
            </label>
            <label class="lbl" data-i18n="settings.visionModel"></label>
            <select id="setVisionModel"></select>
          </div>

          <div class="card set-card">
            <h3 class="set-title" data-i18n="settings.backend"></h3>
            <label class="lbl" data-i18n="settings.ollamaUrl"></label>
            <input type="text" id="setOllama" placeholder="http://127.0.0.1:11434">
            <label class="lbl" data-i18n="settings.comfyuiUrl"></label>
            <input type="text" id="setComfy" placeholder="http://127.0.0.1:8188">
            <label class="lbl" data-i18n="settings.comfyRoot"></label>
            <input type="text" id="setComfyRoot" placeholder="C:\ComfyUI\ComfyUI">
            <label class="lbl" data-i18n="settings.remoteUrl"></label>
            <input type="text" id="setRemoteUrl" placeholder="http://127.0.0.1:8001">
            <p class="set-note" data-i18n="settings.remoteHint"></p>
            <label class="lbl" data-i18n="settings.imageDefault"></label>
            <select id="setImageDefault"></select>
            <label class="lbl" data-i18n="settings.videoDefault"></label>
            <select id="setVideoDefault"></select>
            <div class="gen-actions">
              <div class="gen-status" id="setStatus"></div>
              <button class="btn btn-primary" id="saveSettingsBtn" type="button" data-i18n="settings.save"></button>
            </div>
          </div>

          <div class="card set-card set-span">
            <h3 class="set-title" data-i18n="status.checking"></h3>
            <div class="model-gauges" id="modelGauges"></div>
          </div>

          <div class="card set-card set-span">
            <h3 class="set-title" data-i18n="settings.modelsAvailable"></h3>
            <div class="models-list" id="modelsList"></div>
            <button class="btn btn-sm" id="refreshModelsBtn" type="button" data-i18n="settings.refreshModels"></button>
          </div>

        </div>
      </section>

    </main>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
